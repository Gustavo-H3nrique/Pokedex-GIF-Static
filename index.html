<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link rel="icon" href="./favicons/favicon-16x16.png">
    <link rel="stylesheet" href="./css/style.css">


    <script defer src="./js/script.js"></script>

    <title>Pokedex</title>
</head>
<body>

    <main>
      <img src="#" alt="pokemon" class="pokemon_image"> 
       
      <h1 class="pokemon_data">
        <span class="pokemon_number"></span> 
        <span class="pokemon_name"></span>
      </h1>


      <form class="form">
        <input
         type="search"
         class="input_search"
         placeholder="Name or Number"
         required
         />
      </form>

      <div>
        <ul class="pokemon_ability"></ul>
      </div>

      <div>
        <button class="button btn-cry">🔊</button>
        <button class="button btn-music" id="btnMusic">🎵</button>
      </div>

      <div>
        <div class="pokemon_types">
       </div>
      </div>


      <div class="buttons">
        <button class="button btn-prev">Prev <</button>
        <button class="button btn-next">Next ></button>
      </div>

      <audio id="bgMusic" loop>
        <source src="./poketheme.mp3" type="audio/mpeg">
      </audio>

      <img src="./images/pokedexm.png" alt="pokedex" class="pokedex">

    </main>
    
</body>
</html>
